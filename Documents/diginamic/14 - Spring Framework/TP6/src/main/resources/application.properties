spring.application.name=TP6
# Connexion a la base MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/recensement?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate : creer et supprimer les tables automatiquement a chaque demarrage
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Afficher les requetes SQL dans la console (optionnel mais pratique)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

debug=true